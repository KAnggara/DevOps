name: Maven Test

on:
  push:
    branches:
      - main
    paths:
      - "test/mvn/**"
      - ".github/workflows/mavenTest.yaml"
  workflow_dispatch:

jobs:
  mavenTest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    name: Maven Test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: KAnggara/DevOps/test/mvn@v0.1.17
        with:
          path: action_test/mvn
