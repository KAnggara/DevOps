name: Maven Build

on:
  push:
    branches:
      - main
    paths:
      - "mavenbuild/**"
      - ".github/workflows/mavenbuild.yaml"
  workflow_dispatch:

jobs:
  mavenbuild:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    name: Build Maven
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: KAnggara/DevOps/mavenbuild@v0.1.17
        with:
          path: action_test/mvn
